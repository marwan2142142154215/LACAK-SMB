# Media server Live Kerja (SFU). Lihat README.md untuk kebutuhan port & DNS.
services:
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    # network_mode host: WebRTC butuh IP publik mesin ini apa adanya --
    # NAT Docker bridge membuat kandidat ICE salah dan video gagal tersambung.
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Perekam Live Kerja (LiveKit Egress) -- hanya jalan dengan profil
  # "recording": docker compose --profile recording up -d
  # Merekam tiap track kamera & layar staf apa adanya (tanpa transcoding)
  # langsung ke DigitalOcean Spaces. Rekaman diatur backend-adonis (webhook
  # LiveKit); tanpa DO_SPACES_* di backend-adonis/.env tidak ada yang direkam.
  egress:
    image: livekit/egress:v1.14.1
    profiles: [recording]
    restart: unless-stopped
    network_mode: host
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
