<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- PWA: dashboard bisa di-install sebagai aplikasi (lihat public/sw.js) -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="theme-color" content="#eef1f5" />
        <!-- Tema dipasang sebelum CSS dimuat supaya tidak berkedip (lihat src/composables/useTheme.js) -->
        <script>
            ;(function () {
                var theme = 'light'
                try {
                    theme = localStorage.getItem('lacak_theme') === 'dark' ? 'dark' : 'light'
                } catch (e) {}
                document.documentElement.dataset.theme = theme
                if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#070c14')
            })()
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <title>Lacak Master — Dashboard</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
