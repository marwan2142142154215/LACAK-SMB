  <circle cx="450" cy="408" r="34" fill="url(#copperGrad)"/>

  <text x="450" y="650" text-anchor="middle" font-family="'Segoe UI Semibold','Arial',sans-serif"
        font-size="30" font-weight="700" fill="#f5f7fa" letter-spacing="6">FORTUNE</text>

  <text x="450" y="860" text-anchor="middle" font-family="'Segoe UI Semibold','Arial',sans-serif"
        font-size="76" font-weight="800" fill="#f5f7fa" letter-spacing="4">SMB</text>
</svg>
