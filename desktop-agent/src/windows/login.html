<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <title>Masuk — Lacak SMB Agent</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: system-ui, "Segoe UI", sans-serif;
            }
            body {
                margin: 0;
                padding: 28px 24px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }
            h1 {
                font-size: 17px;
                margin: 0 0 2px;
            }
            p.sub {
                margin: 0;
                font-size: 12px;
                opacity: 0.7;
            }
            label {
                font-size: 12px;
                display: block;
                margin-bottom: 4px;
            }
            input {
                width: 100%;
                box-sizing: border-box;
                padding: 9px 10px;
                font-size: 14px;
                border-radius: 8px;
                border: 1px solid rgba(128, 128, 128, 0.45);
                background: transparent;
                color: inherit;
            }
            #code {
                letter-spacing: 0.4em;
                text-align: center;
                font-variant-numeric: tabular-nums;
                font-size: 18px;
            }
            button {
                padding: 10px;
                font-size: 14px;
                font-weight: 600;
                border: 0;
                border-radius: 8px;
                background: #b45309;
                color: #fff;
                cursor: pointer;
            }
            button:disabled {
                opacity: 0.6;
                cursor: default;
            }
            .err {
                color: #dc2626;
                font-size: 12px;
                min-height: 16px;
            }
            .note {
                font-size: 11px;
                opacity: 0.65;
                line-height: 1.4;
            }
            .link {
                background: none;
                border: 0;
                padding: 0;
                margin-top: 10px;
                font-size: 12px;
                font-weight: 500;
                color: #b45309;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div>
            <h1>Masuk Lacak SMB</h1>
            <p class="sub" id="sub">Agen ini membagikan lokasi Anda ke kantor selama Anda bekerja.</p>
        </div>

        <!-- Langkah 1: kredensial -->
        <form id="form-creds">
            <div style="margin-bottom: 10px">
                <label for="u">Username</label>
                <input id="u" autocapitalize="none" autocomplete="username" required />
            </div>
            <div style="margin-bottom: 12px">
                <label for="p">Password</label>
                <input id="p" type="password" autocomplete="current-password" required />
            </div>
            <button id="btn-login" type="submit">Masuk</button>
        </form>

        <!-- Langkah 2: kode 2FA (muncul kalau akun pakai authenticator) -->
        <form id="form-2fa" hidden>
            <div style="margin-bottom: 12px">
                <label for="code">Kode 2FA (6 digit)</label>
                <input
                    id="code"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="______"
                />
            </div>
            <button id="btn-verify" type="submit">Verifikasi</button>
            <button id="back" class="link" type="button">← Ganti akun</button>
        </form>

        <div class="err" id="err"></div>
        <p class="note">
            Dengan masuk, lokasi perangkat (GPS/WiFi) dikirim ke kantor selama sesi berjalan.
            Lokasi harus aktif agar bisa bekerja.
        </p>

        <script>
            const sub = document.getElementById('sub')
            const err = document.getElementById('err')
            const formCreds = document.getElementById('form-creds')
            const form2fa = document.getElementById('form-2fa')
            const btnLogin = document.getElementById('btn-login')
            const btnVerify = document.getElementById('btn-verify')
            const codeInput = document.getElementById('code')
            let challengeToken = null

            function showCreds() {
                challengeToken = null
                err.textContent = ''
                form2fa.hidden = true
                formCreds.hidden = false
                sub.textContent = 'Agen ini membagikan lokasi Anda ke kantor selama Anda bekerja.'
                btnLogin.disabled = false
                btnLogin.textContent = 'Masuk'
            }

            function showTwoFactor() {
                err.textContent = ''
                formCreds.hidden = true
                form2fa.hidden = false
                sub.textContent = 'Masukkan kode 6 digit dari aplikasi authenticator Anda.'
                codeInput.value = ''
                codeInput.focus()
            }

            formCreds.addEventListener('submit', async (e) => {
                e.preventDefault()
                err.textContent = ''
                btnLogin.disabled = true
                btnLogin.textContent = 'Memeriksa…'
                const res = await window.agent.login({
                    username: document.getElementById('u').value.trim().toLowerCase(),
                    password: document.getElementById('p').value,
                })
                if (res.ok) return // main menutup jendela ini & mulai memantau
                if (res.twoFactor) {
                    challengeToken = res.challengeToken
                    showTwoFactor()
                    return
                }
                err.textContent = res.message || 'Login gagal'
                btnLogin.disabled = false
                btnLogin.textContent = 'Masuk'
            })

            form2fa.addEventListener('submit', async (e) => {
                e.preventDefault()
                const code = codeInput.value.trim()
                if (code.length !== 6) {
                    err.textContent = 'Masukkan 6 digit kode.'
                    return
                }
                err.textContent = ''
                btnVerify.disabled = true
                btnVerify.textContent = 'Memeriksa…'
                const res = await window.agent.verifyTwoFactor({ challengeToken, code })
                if (res.ok) return // sukses: main menutup jendela
                err.textContent = res.message || 'Kode 2FA salah'
                codeInput.value = ''
                codeInput.focus()
                btnVerify.disabled = false
                btnVerify.textContent = 'Verifikasi'
            })

            document.getElementById('back').addEventListener('click', showCreds)
        </script>
    </body>
</html>
