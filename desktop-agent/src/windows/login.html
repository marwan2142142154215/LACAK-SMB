<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <title>Masuk — Lacak SMB Agent</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: system-ui, "Segoe UI", sans-serif;
            }
            body {
                margin: 0;
                padding: 28px 24px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }
            h1 {
                font-size: 17px;
                margin: 0 0 2px;
            }
            p.sub {
                margin: 0;
                font-size: 12px;
                opacity: 0.7;
            }
            label {
                font-size: 12px;
                display: block;
                margin-bottom: 4px;
            }
            input {
                width: 100%;
                box-sizing: border-box;
                padding: 9px 10px;
                font-size: 14px;
                border-radius: 8px;
                border: 1px solid rgba(128, 128, 128, 0.45);
                background: transparent;
                color: inherit;
            }
            button {
                padding: 10px;
                font-size: 14px;
                font-weight: 600;
                border: 0;
                border-radius: 8px;
                background: #2563eb;
                color: #fff;
                cursor: pointer;
            }
            button:disabled {
                opacity: 0.6;
                cursor: default;
            }
            .err {
                color: #dc2626;
                font-size: 12px;
                min-height: 16px;
            }
            .note {
                font-size: 11px;
                opacity: 0.65;
                line-height: 1.4;
            }
        </style>
    </head>
    <body>
        <div>
            <h1>Masuk Lacak SMB</h1>
            <p class="sub">Agen ini membagikan lokasi Anda ke kantor selama Anda bekerja.</p>
        </div>
        <form id="form">
            <div style="margin-bottom: 10px">
                <label for="u">Username</label>
                <input id="u" autocapitalize="none" autocomplete="username" required />
            </div>
            <div style="margin-bottom: 12px">
                <label for="p">Password</label>
                <input id="p" type="password" autocomplete="current-password" required />
            </div>
            <button id="btn" type="submit">Masuk</button>
        </form>
        <div class="err" id="err"></div>
        <p class="note">
            Dengan masuk, lokasi perangkat (GPS/WiFi) dikirim ke kantor selama sesi berjalan.
            Lokasi harus aktif agar bisa bekerja.
        </p>
        <script>
            const form = document.getElementById('form')
            const btn = document.getElementById('btn')
            const err = document.getElementById('err')
            form.addEventListener('submit', async (e) => {
                e.preventDefault()
                err.textContent = ''
                btn.disabled = true
                btn.textContent = 'Memeriksa…'
                const res = await window.agent.login({
                    username: document.getElementById('u').value.trim().toLowerCase(),
                    password: document.getElementById('p').value,
                })
                if (!res.ok) {
                    err.textContent = res.message || 'Login gagal'
                    btn.disabled = false
                    btn.textContent = 'Masuk'
                }
                // Sukses: main menutup jendela ini & mulai memantau.
            })
        </script>
    </body>
</html>
