<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <title>Lokasi diperlukan</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: system-ui, "Segoe UI", sans-serif;
            }
            body {
                margin: 0;
                padding: 28px 26px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                text-align: center;
                align-items: center;
            }
            .icon {
                font-size: 40px;
            }
            h1 {
                font-size: 18px;
                margin: 0;
            }
            p {
                margin: 0;
                font-size: 13px;
                line-height: 1.5;
                opacity: 0.85;
            }
            .reason {
                font-size: 12px;
                color: #dc2626;
                min-height: 16px;
            }
            button {
                padding: 10px 18px;
                font-size: 14px;
                font-weight: 600;
                border: 0;
                border-radius: 8px;
                background: #2563eb;
                color: #fff;
                cursor: pointer;
            }
            ol {
                text-align: left;
                font-size: 12px;
                opacity: 0.8;
                line-height: 1.5;
                margin: 0;
                padding-left: 18px;
            }
        </style>
    </head>
    <body>
        <div class="icon">📍</div>
        <h1>Aktifkan lokasi untuk melanjutkan</h1>
        <p>Pekerjaan memerlukan lokasi aktif. Aktifkan layanan lokasi lalu izinkan aplikasi ini.</p>
        <div class="reason" id="reason"></div>
        <ol>
            <li>Buka Setelan Windows → Privasi &amp; keamanan → Lokasi.</li>
            <li>Nyalakan "Layanan lokasi" dan izinkan aplikasi desktop mengaksesnya.</li>
            <li>Klik "Coba lagi" di bawah.</li>
        </ol>
        <button id="retry" type="button">Coba lagi</button>
        <script>
            const reason = document.getElementById('reason')
            document.getElementById('retry').addEventListener('click', () => window.agent.retry())
            window.agent.onState((s) => {
                reason.textContent = s.lastError || ''
            })
            window.agent.getState().then((s) => {
                reason.textContent = s.lastError || ''
            })
        </script>
    </body>
</html>
