<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <title>Lokasi diperlukan</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: system-ui, "Segoe UI", sans-serif;
            }
            body {
                margin: 0;
                padding: 28px 26px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                text-align: center;
                align-items: center;
            }
            .icon {
                font-size: 40px;
            }
            h1 {
                font-size: 18px;
                margin: 0;
            }
            p {
                margin: 0;
                font-size: 13px;
                line-height: 1.5;
                opacity: 0.85;
            }
            .reason {
                font-size: 12px;
                color: #dc2626;
                min-height: 16px;
            }
            button {
                padding: 10px 18px;
                font-size: 14px;
                font-weight: 600;
                border: 0;
                border-radius: 8px;
                background: #b45309;
                color: #fff;
                cursor: pointer;
            }
            button.secondary {
                background: transparent;
                color: inherit;
                border: 1px solid rgba(128, 128, 128, 0.5);
                font-weight: 500;
            }
            .actions {
                display: flex;
                flex-direction: column;
                gap: 8px;
                width: 100%;
                max-width: 260px;
            }
            ol {
                text-align: left;
                font-size: 12px;
                opacity: 0.8;
                line-height: 1.5;
                margin: 0;
                padding-left: 18px;
            }
        </style>
    </head>
    <body>
        <div class="icon">📍</div>
        <h1>Aktifkan lokasi untuk melanjutkan</h1>
        <p>Pekerjaan memerlukan lokasi aktif. Aktifkan layanan lokasi lalu izinkan aplikasi ini.</p>
        <div class="reason" id="reason"></div>
        <ol>
            <li>Klik <b>"Buka Setelan Lokasi"</b> di bawah.</li>
            <li>Nyalakan <b>"Layanan lokasi"</b> dan <b>"Biarkan aplikasi desktop mengakses lokasi Anda"</b>.</li>
            <li>Kembali ke sini, klik <b>"Coba lagi"</b>.</li>
        </ol>
        <div class="actions">
            <button id="open" type="button">Buka Setelan Lokasi</button>
            <button id="retry" class="secondary" type="button">Coba lagi</button>
        </div>
        <script>
            const reason = document.getElementById('reason')
            document.getElementById('open').addEventListener('click', () => window.agent.openLocationSettings())
            document.getElementById('retry').addEventListener('click', () => window.agent.retry())
            window.agent.onState((s) => {
                reason.textContent = s.lastError || ''
            })
            window.agent.getState().then((s) => {
                reason.textContent = s.lastError || ''
            })
        </script>
    </body>
</html>
